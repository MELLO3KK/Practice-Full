<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"> -->
</head>
<body>
    <div id="particles-container"></div>
    <div id="confetti-container"></div>
    <div id="streak-container"><span id="streak-fire">🔥</span> <span id="streak-count">0</span> Streak!</div>
    <div id="timer-container"><i class="fas fa-clock"></i> <span id="timer-display">00:00</span></div>
    <div id="autosave-indicator"><i class="fas fa-sync-alt"></i> <span>Saving...</span></div>

    <button id="settings-btn" data-tooltip="Settings"><i class="fas fa-cog"></i></button>
    <div id="settings-panel">
        <h3><i class="fas fa-sliders-h"></i> Settings</h3>
        <div class="setting-row">
            <label>Sound Effects</label>
            <label class="toggle-switch">
                <input type="checkbox" id="sound-toggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label>Timer Mode</label>
            <label class="toggle-switch">
                <input type="checkbox" id="timer-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label>Shuffle Questions</label>
            <label class="toggle-switch">
                <input type="checkbox" id="shuffle-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label>Keyboard Shortcuts</label>
            <label class="toggle-switch">
                <input type="checkbox" id="keyboard-toggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label>Reattempt on Mistakes</label>
            <label class="toggle-switch">
                <input type="checkbox" id="reattempt-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label>Grouped Quiz Mode</label>
            <label class="toggle-switch">
                <input type="checkbox" id="grouped-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <label>Time per Question</label>
            <select id="timer-duration" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ddd;">
                <option value="15">15 seconds</option>
                <option value="30" selected>30 seconds</option>
                <option value="60">60 seconds</option>
                <option value="90">90 seconds</option>
            </select>
        </div>
    </div>

    <div class="theme-switch-container">
        <label id="theme-switch" class="theme-switch">
            <input type="checkbox" id="theme-checkbox">
            <span class="slider round"></span>
        </label>
    </div>
    <div class="view-container">
        <div id="home-view">
            <h1>Quiz Master</h1>
            <div class="home-controls">
                <button id="go-to-creator-btn">Create a New Quiz</button>
                <button id="edit-quiz-btn">Edit a Quiz</button>
                <button id="go-to-taker-btn">Take a Quiz</button>
            </div>
        </div>

        <div id="creator-view" class="hidden">
            <div class="creator-header">
                <h2>Create a New Quiz</h2>
                <div class="creator-main-controls">
                    <button id="creator-return-home-btn" class="btn-secondary">
                        <i class="fas fa-home"></i> Return to Home
                    </button>
                    <button id="save-quiz-btn" class="btn-save">
                        <i class="fas fa-save"></i> Save Quiz
                    </button>
                </div>
            </div>
            <div class="quiz-title-container">
                <input type="text" id="quiz-title" placeholder="Enter Your Quiz Title Here...">
            </div>
            <div id="questions-container" class="sortable-list"></div>

            <div id="add-question-prompt" class="hidden">
                <div class="question-count-badge">
                    <i class="fas fa-layer-group"></i>
                    <span id="question-count-text">0 Questions</span>
                </div>
                <div class="previous-questions-strip" id="mini-cards-container"></div>
                <h3>What would you like to do next?</h3>
                <p>Add more questions or finish creating your quiz</p>
                <div class="prompt-buttons">
                    <button class="prompt-btn add-more" id="prompt-add-btn">
                        <i class="fas fa-plus-circle"></i> Add Another Question
                    </button>
                    <button class="prompt-btn finish" id="prompt-finish-btn">
                        <i class="fas fa-check-circle"></i> Finish Quiz
                    </button>
                </div>
            </div>

            <div class="creator-footer-controls">
                <button id="add-question-btn" class="btn-primary">
                    <i class="fas fa-plus"></i> Add Question
                </button>
                <button id="add-divider-btn" class="btn-secondary">
                    <i class="fas fa-layer-group"></i> Add Group Divider
                </button>
            </div>
        </div>

        <div id="taker-view" class="hidden">
            <div class="taker-header">
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <button id="taker-close-btn" class="close-btn">&times;</button>
            </div>
            <div id="taker-content">
                <h2 id="taker-quiz-title"></h2>
                <div id="taker-question-area">
                    <div class="question-media"></div>
                    <p id="current-question-text"></p>
                </div>
                <div id="taker-options-container"></div>
            </div>
            <div id="taker-footer">
                <div id="feedback-container" class="hidden">
                    <div id="feedback-message"></div>
                    <div id="post-quiz-actions" class="hidden">
                        <div id="score-result"></div>
                        <button id="restart-quiz-btn">Restart Quiz</button>
                        <button id="return-home-btn">Return to Home</button>
                    </div>
                    <button id="next-question-btn" class="hidden">Continue</button>
                </div>
                <button id="check-answer-btn">Check</button>
            </div>
        </div>
    </div>

    <div id="draft-restore-dialog" class="hidden">
        <div class="dialog-content">
            <p>Restore unsaved changes?</p>
            <div class="dialog-buttons">
                <button id="restore-draft-btn">Yes</button>
                <button id="discard-draft-btn">No</button>
            </div>
        </div>
    </div>

    <div id="notification-bar"></div>

    <script src="sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
